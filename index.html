<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampcontrol — LinkedIn wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;1,600;1,700&display=swap" rel="stylesheet">

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT THIS BLOCK ONLY.

   This version renders its own cards from posts.json. There is no
   LinkedIn iframe any more, which means nothing is cropped: every
   image, carousel slide and video is shown whole, letterboxed into
   an identical media area on each card.

   postsPerScreen   how many posts share a screen (1-4).
   layout           'columns' side by side, 'rows' stacked,
                    'auto' picks by screen shape.
   secondsPerScreen how long each screenful holds.
   slideSeconds     how long each carousel slide holds.
   playVideo        false shows the poster frame instead of playing.
   maxCopyLines     lines of post copy above the media.

   Press D on a keyboard to see which media loaded and which failed.
   ───────────────────────────────────────────────────────────── */
const CONFIG = {
  feedApi: './posts.json',
  eyebrow: 'Ampcontrol',
  title: 'Latest from LinkedIn',
  postsPerScreen: 3,
  layout: 'columns',
  secondsPerScreen: 24,
  slideSeconds: 4,
  refreshMinutes: 15,
  playVideo: true,
  maxCopyLines: 4
};

/* Any setting above can also be passed in the URL, which is the easier way to
   change things in Fusion Signage: its player caches the page, so editing this
   file may not reach the screen, but a changed URL always does.

     .../linkedin-signage/?secondsPerScreen=15&slideSeconds=3

   The URL wins over the values above. */
(function(){
  try {
    var q = new URLSearchParams(window.location.search);
    q.forEach(function(value, key){
      if (!Object.prototype.hasOwnProperty.call(CONFIG, key)) return;
      var current = CONFIG[key];
      if (typeof current === 'number'){
        var n = Number(value);
        if (!isNaN(n) && n > 0) CONFIG[key] = n;
      } else if (typeof current === 'boolean'){
        CONFIG[key] = (value === 'true' || value === '1' || value === 'yes');
      } else if (value){
        CONFIG[key] = value;
      }
    });
  } catch (e){ /* older player, ignore and use the values above */ }
})();
</script>

<style>
  :root{
    --deep:   #043D9A;
    --blue:   #006CD3;
    --orange: #F06F0B;
    --paper:  #FFFFFF;
    --ink:    rgba(255,255,255,.62);
    --body:   #1B2C47;
    --muted:  #5B6B85;
    --mat:    #EDF1F7;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }

  body{
    background:linear-gradient(-40deg, var(--deep) 0%, var(--blue) 68%, #0B84E8 100%);
    font-family:'Kanit', Arial, Helvetica, sans-serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(120% 60% at 78% -8%, rgba(255,255,255,.16), transparent 60%);
  }

  .stage{
    position:fixed; inset:0;
    display:grid; grid-template-rows:auto 1fr auto;
    padding:clamp(16px,2.1vmin,38px);
    gap:clamp(10px,1.4vmin,22px);
  }

  .brandbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .eyebrow{
    font-weight:700; font-style:italic; text-transform:uppercase;
    letter-spacing:.14em; font-size:clamp(14px,1.6vmin,24px); color:var(--orange);
  }
  .title{
    font-weight:600; font-style:italic; text-transform:uppercase;
    letter-spacing:.02em; line-height:.98; font-size:clamp(24px,3.4vmin,52px);
  }
  .clock{
    font-weight:300; font-size:clamp(13px,1.5vmin,22px); color:var(--ink);
    letter-spacing:.05em; white-space:nowrap; font-variant-numeric:tabular-nums;
  }

  .panel{ position:relative; }

  .slide{
    position:absolute; inset:0;
    display:grid; gap:clamp(10px,1.6vmin,26px);
    opacity:0; transition:opacity .7s ease; pointer-events:none;
  }
  .slide.is-live{ opacity:1; }

  /* ── the card: copy on top, media below, footer last ── */
  .card{
    position:relative; overflow:hidden;
    background:var(--paper); color:var(--body);
    border-radius:clamp(8px,1.1vmin,18px);
    box-shadow:0 clamp(5px,.9vmin,16px) clamp(18px,3vmin,48px) rgba(2,20,52,.34);
    display:grid; grid-template-rows:auto auto 1fr auto;
    padding:clamp(14px,1.7vmin,26px);
    gap:clamp(9px,1.05vmin,16px);
  }

  /* ── who posted it ── */
  .who{ display:flex; align-items:center; gap:clamp(7px,.85vmin,13px); }
  .who img{
    width:clamp(30px,3.5vmin,52px); height:clamp(30px,3.5vmin,52px);
    border-radius:99px; flex:none;
    /* contain, not cover: the Ampcontrol mark is wide and a circular crop
       would clip it. Letterboxed inside the circle instead. */
    object-fit:contain; background:#fff; padding:1px;
    border:1px solid #E4E9F1;
  }
  .who .id{ min-width:0; line-height:1.24; }
  .who .name{
    font-weight:600; font-size:clamp(12px,1.35vmin,20px);
    color:var(--body); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .who .sub{
    font-weight:300; font-size:clamp(9px,1.02vmin,15px); color:var(--muted);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .who .sub b{ font-weight:300; }
  .who .sub .dot{ opacity:.55; padding:0 .35em; }

  .copy{
    font-weight:400; line-height:1.36;
    font-size:clamp(13px,1.45vmin,21px);
    display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden;
    -webkit-line-clamp:var(--clamp, 4);
  }
  /* With the media hidden, the card has only two children left, so the
     three-row template would drop the footer into the middle row and leave
     dead space under it. Two rows, copy taking the slack. */
  .card[data-media="none"]{ grid-template-rows:auto 1fr auto; }

  /* a post with no media gets the whole card for its words */
  .card[data-media="none"] .copy{
    -webkit-line-clamp:16;
    font-size:clamp(15px,1.75vmin,26px);
    line-height:1.42;
  }

  /* the media area: identical on every card, nothing ever cropped */
  .media{
    position:relative; overflow:hidden;
    border-radius:clamp(5px,.7vmin,11px);
    background:var(--mat);
    display:grid; place-items:center;
  }
  .card[data-media="none"] .media{ display:none; }

  .media img, .media video{
    max-width:100%; max-height:100%;
    width:auto; height:auto;
    object-fit:contain;          /* letterboxed, never cropped */
    display:block;
  }
  /* carousel slides stack and cross-fade in place */
  .media .page{
    position:absolute; inset:0;
    display:grid; place-items:center; padding:0;
    opacity:0; transition:opacity .5s ease;
  }
  .media .page.on{ opacity:1; }

  .pager{
    position:absolute; left:0; right:0; bottom:clamp(6px,.8vmin,12px);
    display:flex; justify-content:center; gap:clamp(4px,.55vmin,8px);
    pointer-events:none;
  }
  .pager i{
    width:clamp(5px,.62vmin,9px); height:clamp(5px,.62vmin,9px);
    border-radius:99px; background:rgba(9,32,68,.26);
    transition:background .35s ease, width .35s ease;
  }
  .pager i.on{ background:var(--orange); width:clamp(15px,1.9vmin,26px); }

  .foot{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; border-top:1px solid #E4E9F1; padding-top:clamp(7px,.85vmin,13px);
    font-size:clamp(10px,1.12vmin,16px); font-weight:300; color:var(--muted);
  }
  .reacts{ display:flex; align-items:center; gap:clamp(4px,.5vmin,7px); }
  .reacts .icons{ display:flex; align-items:center; }
  .reacts .icons svg{
    width:clamp(14px,1.55vmin,22px); height:clamp(14px,1.55vmin,22px);
    border-radius:99px; margin-left:-.28em; border:1.5px solid #fff;
  }
  .reacts .icons svg:first-child{ margin-left:0; }
  .reacts .n{ font-weight:500; color:var(--body); font-variant-numeric:tabular-nums; }

  /* the media-type chip sits on the media, the way LinkedIn labels a document */
  .chip{
    position:absolute; left:clamp(6px,.75vmin,11px); top:clamp(6px,.75vmin,11px);
    background:rgba(9,26,54,.76); color:#fff;
    font-weight:600; font-style:italic; text-transform:uppercase;
    letter-spacing:.08em; font-size:clamp(8px,.92vmin,13px);
    padding:.32em .7em; border-radius:99px; pointer-events:none;
  }

  .notice{
    position:absolute; inset:0; display:grid; place-content:center; text-align:center;
    padding:8%; gap:12px; color:var(--deep);
    background:var(--paper); border-radius:clamp(8px,1.1vmin,18px);
  }
  .notice b{ font-weight:600; font-style:italic; text-transform:uppercase; font-size:1.3em; }
  .notice span{ font-weight:300; color:var(--muted); line-height:1.5; }

  .ticker{ display:flex; align-items:center; gap:clamp(12px,1.8vmin,28px); }
  .wave{ flex:1; height:clamp(18px,2.4vmin,38px); overflow:visible; }
  .wave .track{ fill:none; stroke:rgba(255,255,255,.22); stroke-width:2.5; }
  .wave .fill{ fill:none; stroke:var(--orange); stroke-width:4.5; stroke-linecap:round; }

  .dots{ display:flex; gap:clamp(6px,.9vmin,12px); }
  .dots i{
    display:block; width:clamp(7px,.9vmin,12px); height:clamp(7px,.9vmin,12px);
    border-radius:99px; background:rgba(255,255,255,.3);
    transition:background .4s ease, width .4s ease;
  }
  .dots i.on{ background:var(--orange); width:clamp(22px,2.8vmin,38px); }

  /* diagnostics, D to toggle */
  .debug{
    position:fixed; right:14px; top:14px; z-index:99; display:none;
    background:rgba(4,22,52,.93); color:#DCE7F7; padding:14px 16px;
    border-radius:10px; font-size:12px; line-height:1.55; max-width:44ch;
    font-weight:300; white-space:pre-wrap;
  }
  .debug.on{ display:block; }
  .debug b{ color:var(--orange); font-weight:600; }

  @media (prefers-reduced-motion: reduce){
    .slide, .media .page{ transition-duration:.15s; }
    .dots i, .pager i{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <header class="brandbar">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="title" id="title"></h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <main class="panel" id="panel"></main>

  <footer class="ticker">
    <svg class="wave" id="wave" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true">
      <path class="track" id="track"></path>
      <path class="fill"  id="fill"></path>
    </svg>
    <div class="dots" id="dots"></div>
  </footer>
</div>

<div class="debug" id="debug"></div>

<script>
(function(){
  'use strict';

  var panel  = document.getElementById('panel');
  var dotsEl = document.getElementById('dots');
  var dbgEl  = document.getElementById('debug');

  var slides  = [];      // { el, dot, cards:[cardState] }
  var current = [];      // urns currently built, to detect changes
  var idx = -1, started = 0, paused = false, pausedAt = 0;
  var DUR = (CONFIG.secondsPerScreen || 24) * 1000;
  var SLIDE_MS = Math.max(1500, (CONFIG.slideSeconds || 4) * 1000);
  var PER = Math.max(1, Math.min(4, CONFIG.postsPerScreen || 3));
  var loadLog = [];

  function mode(){
    var m = CONFIG.layout || 'columns';
    if (m === 'auto') return window.innerWidth >= window.innerHeight ? 'columns' : 'rows';
    return m === 'rows' ? 'rows' : 'columns';
  }

  document.documentElement.style.setProperty(
    '--clamp', String(Math.max(1, Math.min(30, CONFIG.maxCopyLines || 4))));

  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;
  document.getElementById('title').textContent   = CONFIG.title;

  /* ── sine wave progress ── */
  var track = document.getElementById('track');
  var fill  = document.getElementById('fill');
  var d = '';
  for (var x = 0; x <= 1000; x += 4){
    var y = 30 - 19 * Math.sin((x / 1000) * Math.PI * 5);
    d += (x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(2) + ' ';
  }
  track.setAttribute('d', d);
  fill.setAttribute('d', d);
  var LEN = fill.getTotalLength();
  fill.style.strokeDasharray = LEN;
  function drawWave(p){ fill.style.strokeDashoffset = LEN * (1 - p); }
  drawWave(0);

  /* ── clock ── */
  var clock = document.getElementById('clock');
  function tick(){
    clock.textContent = new Date().toLocaleString('en-AU', {
      weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    });
  }
  tick(); setInterval(tick, 20000);

  function notice(head, body){
    panel.innerHTML = ''; dotsEl.innerHTML = ''; slides = [];
    var n = document.createElement('div');
    n.className = 'notice';
    n.innerHTML = '<b>' + head + '</b><span>' + body + '</span>';
    panel.appendChild(n);
  }
  notice('Connecting', 'Fetching the latest posts from LinkedIn.');

  function when(dateStr){
    if (!dateStr) return '';
    var t = new Date(dateStr);
    if (isNaN(t)) return '';
    var days = Math.floor((Date.now() - t) / 86400000);
    if (days <= 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days < 7)  return days + ' days ago';
    var wk = Math.floor(days / 7);
    if (wk < 5) return wk + (wk === 1 ? ' week ago' : ' weeks ago');
    return t.toLocaleDateString('en-AU', { day:'numeric', month:'short' });
  }

  /* LinkedIn's own reaction glyphs are served from their CDN and may not load
     on every network, so these are drawn here in their palette. Simplified,
     but at 16px the simplification is invisible. */
  var REACT = {
    LIKE:          { bg:'#378FE9', d:'M5.2 7.4h1.5v4.4H5.2zM7.6 7.4c.9-.6 1.6-1.5 1.8-2.6.1-.5.5-.8 1-.8.6 0 1.1.5 1.1 1.1 0 .5-.1 1-.3 1.4h1.9c.6 0 1.1.5 1.1 1.1 0 .2 0 .3-.1.5l-.9 2.8c-.2.6-.7 1-1.3 1H7.6z' },
    PRAISE:        { bg:'#6DAE4F', d:'M6.3 11.6L4.9 8.1c-.2-.5 0-1 .5-1.2.4-.2.9 0 1.1.4l.6 1.2-1-3.3c-.2-.5.1-1 .6-1.2.5-.1 1 .2 1.1.7l.7 2.4-.3-2.6c-.1-.5.3-1 .8-1 .5-.1 1 .3 1 .8l.4 2.7.4-1.7c.1-.5.6-.8 1.1-.7.5.1.8.6.7 1.1l-.9 4.2c-.3 1.3-1.4 2.2-2.7 2.2-1.1 0-2.1-.6-2.7-1.5z' },
    EMPATHY:       { bg:'#DF704D', d:'M10 13.4l-.8-.7C6.4 10.2 5 8.9 5 7.3c0-1.3 1-2.3 2.3-2.3.7 0 1.4.3 1.9.9l.8.9.8-.9c.5-.6 1.2-.9 1.9-.9 1.3 0 2.3 1 2.3 2.3 0 1.6-1.4 2.9-4.2 5.4z' },
    APPRECIATION:  { bg:'#8B7FD4', d:'M7 12.8V7.9c0-.4.3-.8.8-.8s.8.3.8.8V5.2c0-.4.3-.8.8-.8s.8.3.8.8v1.9c0-.4.3-.8.8-.8s.8.3.8.8v1.1c0-.4.3-.8.8-.8s.8.3.8.8v2.6c0 1.4-1.1 2.5-2.5 2.5H8.9c-1 0-1.9-.8-1.9-1.5z' },
    INTEREST:      { bg:'#E7A33E', d:'M8.4 12.6h3.2v.9c0 .3-.3.6-.6.6H9c-.3 0-.6-.3-.6-.6zM10 3.9c2 0 3.6 1.6 3.6 3.6 0 1.3-.7 2.3-1.5 3-.3.3-.5.6-.5 1v.3H8.4v-.3c0-.4-.2-.7-.5-1-.8-.7-1.5-1.7-1.5-3 0-2 1.6-3.6 3.6-3.6z' },
    ENTERTAINMENT: { bg:'#44BFD6', d:'M10 3.9c3.4 0 6.1 2.7 6.1 6.1S13.4 16.1 10 16.1 3.9 13.4 3.9 10 6.6 3.9 10 3.9zm-2.6 4.5c-.5 0-.9.4-.9.9s.4.9.9.9.9-.4.9-.9-.4-.9-.9-.9zm5.2 0c-.5 0-.9.4-.9.9s.4.9.9.9.9-.4.9-.9-.4-.9-.9-.9zM6.8 11.6c.5 1.5 1.8 2.5 3.2 2.5s2.7-1 3.2-2.5z' }
  };

  function reactionIcon(type){
    var r = REACT[type] || REACT.LIKE;
    return '<svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
           '<circle cx="10" cy="10" r="10" fill="' + r.bg + '"/>' +
           '<path d="' + r.d + '" fill="#fff"/></svg>';
  }

  function group(n){
    if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  /* LinkedIn only releases the first three slides of a document, but it does
     tell us the real length. Say "3 of 6" rather than "3 slides" — three dots
     under a "6 slides" label just reads as broken. */
  function badgeFor(p){
    if (p.mediaType === 'document'){
      var have  = p.pageCount || 0;
      var total = p.totalPages || have;
      if (!have) return 'Document';
      if (total > have) return have + ' of ' + total + ' slides';
      return have > 1 ? have + ' slides' : 'Document';
    }
    if (p.mediaType === 'video') return 'Video';
    if (p.mediaType === 'image' && p.pageCount > 1) return p.pageCount + ' photos';
    return '';
  }

  /* Records why a card ended up looking how it looks, for the D overlay. */
  function log(urn, type, status){
    loadLog.push({ urn: urn.replace(/^urn:li:\w+:/, ''), type: type, status: status });
    if (loadLog.length > 40) loadLog.shift();
  }

  /* ── build one card ── */
  function buildCard(p){
    var card = document.createElement('article');
    card.className = 'card';

    /* who posted it */
    var who = document.createElement('header');
    who.className = 'who';
    if (p.avatar){
      var av = document.createElement('img');
      av.src = p.avatar; av.alt = '';
      av.addEventListener('error', function(){ av.style.visibility = 'hidden'; });
      who.appendChild(av);
    }
    var id = document.createElement('div');
    id.className = 'id';
    var nm = document.createElement('div');
    nm.className = 'name';
    nm.textContent = p.author || CONFIG.eyebrow;
    var sub = document.createElement('div');
    sub.className = 'sub';
    var bits = [];
    if (p.followers) bits.push(p.followers + ' followers');
    if (p.age) bits.push(p.age);
    else if (p.date) bits.push(when(p.date));
    sub.innerHTML = bits.join('<span class="dot">·</span>');
    id.appendChild(nm); id.appendChild(sub);
    who.appendChild(id);
    card.appendChild(who);

    var copy = document.createElement('div');
    copy.className = 'copy';
    copy.textContent = p.copy || p.title || '';
    card.appendChild(copy);

    var media = document.createElement('div');
    media.className = 'media';
    card.appendChild(media);

    var state = { card: card, pages: [], pageIdx: 0, pageAt: 0, video: null };
    var hasMedia = false;

    /* video: play the highest rendition the browser accepts, poster if none */
    if (p.mediaType === 'video' && p.video && p.video.length && CONFIG.playVideo){
      var v = document.createElement('video');
      v.muted = true; v.loop = true; v.playsInline = true;
      v.setAttribute('muted',''); v.setAttribute('playsinline','');
      v.preload = 'metadata';
      if (p.poster) v.poster = p.poster;
      p.video.forEach(function(s){
        var src = document.createElement('source');
        src.src = s.src; src.type = s.type || 'video/mp4';
        v.appendChild(src);
      });
      v.addEventListener('loadeddata', function(){ log(p.urn, 'video', 'playing'); });
      v.addEventListener('error', function(){
        // every rendition refused: fall back to the poster still
        log(p.urn, 'video', 'blocked, using poster');
        v.remove();
        if (p.poster) addImage(media, p.poster, p.urn, 'poster');
        else degrade(card);
      });
      media.appendChild(v);
      state.video = v;
      hasMedia = true;

    /* document: every slide, cross-fading */
    } else if (p.mediaType === 'document' && p.pages && p.pages.length){
      p.pages.forEach(function(src, i){
        var page = document.createElement('div');
        page.className = 'page' + (i === 0 ? ' on' : '');
        var im = document.createElement('img');
        im.src = src; im.alt = '';
        im.addEventListener('load',  function(){ if (i === 0) log(p.urn, 'doc', 'slides ok'); });
        im.addEventListener('error', function(){
          if (i === 0) log(p.urn, 'doc', 'slides blocked');
          page.remove();
          state.pages = state.pages.filter(function(x){ return x !== page; });
          if (!state.pages.length) degrade(card);
        });
        page.appendChild(im);
        media.appendChild(page);
        state.pages.push(page);
      });
      if (p.pages.length > 1){
        var pager = document.createElement('div');
        pager.className = 'pager';
        p.pages.forEach(function(_, i){
          var dot = document.createElement('i');
          if (i === 0) dot.className = 'on';
          pager.appendChild(dot);
        });
        media.appendChild(pager);
        state.pager = pager;
      }
      hasMedia = true;

    /* plain image, or a video poster when playback is off */
    } else {
      var src2 = p.image || (p.mediaType === 'video' ? p.poster : null);
      if (src2){ addImage(media, src2, p.urn, p.mediaType); hasMedia = true; }
    }

    card.setAttribute('data-media', hasMedia ? p.mediaType : 'none');
    if (!hasMedia) log(p.urn, p.mediaType || 'text', 'no media, copy only');

    var label = badgeFor(p);
    if (hasMedia && label){
      var chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = label;
      media.appendChild(chip);
    }

    var foot = document.createElement('div');
    foot.className = 'foot';

    var left = document.createElement('span');
    left.className = 'reacts';
    if (p.reactions){
      var icons = document.createElement('span');
      icons.className = 'icons';
      var types = (p.reactionTypes && p.reactionTypes.length) ? p.reactionTypes : ['LIKE'];
      icons.innerHTML = types.map(reactionIcon).join('');
      var n = document.createElement('span');
      n.className = 'n';
      n.textContent = group(p.reactions);
      left.appendChild(icons); left.appendChild(n);
    }

    var right = document.createElement('span');
    if (p.comments){
      right.textContent = group(p.comments) +
        (p.comments === 1 ? ' comment' : ' comments');
    }

    foot.appendChild(left); foot.appendChild(right);
    card.appendChild(foot);

    return state;
  }

  function addImage(media, src, urn, type){
    var im = document.createElement('img');
    im.src = src; im.alt = '';
    im.addEventListener('load',  function(){ log(urn, type, 'image ok'); });
    im.addEventListener('error', function(){
      log(urn, type, 'image blocked');
      im.remove();
      degrade(im.closest('.card'));
    });
    media.appendChild(im);
  }

  /* media refused to load: give the words the whole card instead of
     leaving a grey hole where a picture should be */
  function degrade(card){
    if (card) card.setAttribute('data-media', 'none');
  }

  /* ── build all screenfuls ── */
  function build(posts){
    panel.innerHTML = ''; dotsEl.innerHTML = ''; slides = []; loadLog = [];

    /* Split into screenfuls. An earlier version merged a short final screen
       into the one before it and then trimmed to PER, which silently threw
       posts away whenever the count wasn't an exact multiple. Every post now
       gets shown; a short last screen is padded with blanks instead. */
    var pages = [];
    for (var i = 0; i < posts.length; i += PER) pages.push(posts.slice(i, i + PER));

    pages.forEach(function(page){
      var slide = document.createElement('div');
      slide.className = 'slide';
      applyGrid(slide);

      var cards = [];
      page.forEach(function(p){
        var st = buildCard(p);
        slide.appendChild(st.card);
        cards.push(st);
      });
      for (var k = page.length; k < PER; k++) slide.appendChild(document.createElement('div'));

      panel.appendChild(slide);
      var dot = document.createElement('i');
      dotsEl.appendChild(dot);
      slides.push({ el: slide, dot: dot, cards: cards });
    });

    idx = -1;
    show(0);
  }

  function applyGrid(slide){
    if (mode() === 'columns'){
      slide.style.gridTemplateColumns = 'repeat(' + PER + ', 1fr)';
      slide.style.gridTemplateRows = '1fr';
    } else {
      slide.style.gridTemplateColumns = '1fr';
      slide.style.gridTemplateRows = 'repeat(' + PER + ', 1fr)';
    }
  }

  window.addEventListener('resize', function(){
    var els = panel.querySelectorAll('.slide');
    for (var i = 0; i < els.length; i++) applyGrid(els[i]);
  });

  function show(n){
    if (!slides.length) return;
    idx = (n + slides.length) % slides.length;
    slides.forEach(function(s, i){
      var live = i === idx;
      s.el.classList.toggle('is-live', live);
      s.dot.classList.toggle('on', live);
      s.cards.forEach(function(c){
        if (!c.video) return;
        if (live){ var pr = c.video.play(); if (pr && pr.catch) pr.catch(function(){}); }
        else c.video.pause();
      });
      // restart carousels from slide one each time the screen comes round
      if (live) s.cards.forEach(function(c){
        if (c.pages.length) setPage(c, 0);
        c.pageAt = performance.now();
      });
    });
    started = performance.now();
    drawWave(0);
  }

  function setPage(c, n){
    if (!c.pages.length) return;
    c.pageIdx = (n + c.pages.length) % c.pages.length;
    c.pages.forEach(function(p, i){ p.classList.toggle('on', i === c.pageIdx); });
    if (c.pager){
      var dots = c.pager.children;
      for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === c.pageIdx);
    }
  }

  function frame(now){
    if (!paused && slides.length){
      var p = Math.min((now - started) / DUR, 1);
      drawWave(p);

      var live = slides[idx];
      if (live) live.cards.forEach(function(c){
        if (c.pages.length > 1 && now - c.pageAt >= SLIDE_MS){
          c.pageAt = now;
          setPage(c, c.pageIdx + 1);
        }
      });

      if (p >= 1) show(idx + 1);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ── poll posts.json ── */
  function sameList(a, b){
    return a.length === b.length && a.every(function(v, i){ return v === b[i]; });
  }

  function refresh(){
    fetch(CONFIG.feedApi + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var posts = (data && data.posts) || [];
        if (!posts.length){
          if (!slides.length){
            notice('No posts yet',
                   'posts.json loaded but had no posts in it. Check the FEED_URL ' +
                   'secret, then run the Refresh LinkedIn feed action.');
          }
          return;
        }
        var urns = posts.map(function(p){ return p.urn; });
        if (!sameList(urns, current)){ current = urns; build(posts); }
      })
      .catch(function(){
        if (!slides.length){
          notice('Can\u2019t reach the feed',
                 'The player could not load posts.json. It will keep retrying.');
        }
      });
  }
  refresh();
  setInterval(refresh, Math.max(5, CONFIG.refreshMinutes || 15) * 60000);

  /* ── keyboard: arrows step, space pauses, D shows diagnostics ── */
  function renderDebug(){
    var counts = {};
    loadLog.forEach(function(l){ counts[l.status] = (counts[l.status] || 0) + 1; });
    var lines = ['<b>Media status</b>'];
    Object.keys(counts).forEach(function(k){ lines.push(counts[k] + ' × ' + k); });
    lines.push('');
    lines.push('<b>Per post</b>');
    loadLog.forEach(function(l){ lines.push(l.urn.slice(-6) + '  ' + l.type + '  ' + l.status); });
    dbgEl.innerHTML = lines.join('\n');
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === 'd' || e.key === 'D'){
      dbgEl.classList.toggle('on');
      if (dbgEl.classList.contains('on')) renderDebug();
    }
    else if (e.key === ' '){
      e.preventDefault();
      if (paused){ started += performance.now() - pausedAt; paused = false; }
      else { pausedAt = performance.now(); paused = true; }
    }
  });
})();
</script>
</body>
</html>
