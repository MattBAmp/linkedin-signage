<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ampcontrol — LinkedIn wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,500;0,600;1,600;1,700&display=swap" rel="stylesheet">

<script>
/* ─────────────────────────────────────────────────────────────
   EDIT THIS BLOCK ONLY.

   postsPerScreen   how many posts are on screen at once (1-4).
                    3 fills a portrait screen nicely.

   cropHeight       how much of each post to show, in px, measured
                    at LinkedIn's native 504px width. Every card is
                    cut off at exactly this point, which is what
                    makes them all the same height. Lower = tighter
                    crop, more posts fit. 620 shows the author,
                    a few lines of copy and the image.
   ───────────────────────────────────────────────────────────── */
const CONFIG = {
  feedApi: './posts.json',
  eyebrow: 'Ampcontrol',
  title: 'Latest from LinkedIn',
  postsPerScreen: 3,
  cropHeight: 620,
  secondsPerScreen: 20,
  refreshMinutes: 15,
  collapseLongText: true
};
</script>

<style>
  :root{
    --deep:   #043D9A;
    --blue:   #006CD3;
    --orange: #F06F0B;
    --paper:  #FFFFFF;
    --ink:    rgba(255,255,255,.62);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; overflow:hidden; }

  body{
    background:linear-gradient(-40deg, var(--deep) 0%, var(--blue) 68%, #0B84E8 100%);
    font-family:'Kanit', Arial, Helvetica, sans-serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(120% 60% at 78% -8%, rgba(255,255,255,.16), transparent 60%);
  }

  .stage{
    position:fixed; inset:0;
    display:grid; grid-template-rows:auto 1fr auto;
    padding:clamp(18px,2.8vmin,46px);
    gap:clamp(12px,2vmin,30px);
  }

  .brandbar{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; }
  .eyebrow{
    font-weight:700; font-style:italic; text-transform:uppercase;
    letter-spacing:.14em; font-size:clamp(14px,1.6vmin,24px); color:var(--orange);
  }
  .title{
    font-weight:600; font-style:italic; text-transform:uppercase;
    letter-spacing:.02em; line-height:.98; font-size:clamp(26px,4.2vmin,66px);
  }
  .clock{
    font-weight:300; font-size:clamp(13px,1.5vmin,22px); color:var(--ink);
    letter-spacing:.05em; white-space:nowrap; font-variant-numeric:tabular-nums;
  }

  .panel{ position:relative; }

  /* one .slide = one screenful of N posts */
  .slide{
    position:absolute; inset:0;
    display:grid; gap:clamp(10px,1.6vmin,26px);
    opacity:0; transition:opacity .7s ease; pointer-events:none;
  }
  .slide.is-live{ opacity:1; }

  /* each card crops its embed to an identical height */
  .card{
    position:relative; overflow:hidden;
    background:var(--paper);
    border-radius:clamp(8px,1.1vmin,18px);
    box-shadow:0 clamp(5px,.9vmin,16px) clamp(18px,3vmin,48px) rgba(2,20,52,.34);
  }
  .card .scaler{
    position:absolute; top:0; left:0;
    width:504px; transform-origin:top left;
  }
  .card iframe{ display:block; width:504px; height:100%; border:0; }

  /* fades the hard crop edge so it reads as designed, not broken */
  .card::after{
    content:''; position:absolute; left:0; right:0; bottom:0;
    height:clamp(18px,2.4vmin,40px); pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.92));
  }

  .notice{
    position:absolute; inset:0; display:grid; place-content:center; text-align:center;
    padding:8%; gap:12px; color:var(--deep);
    background:var(--paper); border-radius:clamp(8px,1.1vmin,18px);
  }
  .notice b{ font-weight:600; font-style:italic; text-transform:uppercase; font-size:1.3em; }
  .notice span{ font-weight:300; color:#5b6b85; line-height:1.5; }

  .ticker{ display:flex; align-items:center; gap:clamp(12px,1.8vmin,28px); }
  .wave{ flex:1; height:clamp(22px,3vmin,48px); overflow:visible; }
  .wave .track{ fill:none; stroke:rgba(255,255,255,.22); stroke-width:2.5; }
  .wave .fill{ fill:none; stroke:var(--orange); stroke-width:4.5; stroke-linecap:round; }

  .dots{ display:flex; gap:clamp(6px,.9vmin,12px); }
  .dots i{
    display:block; width:clamp(7px,.9vmin,12px); height:clamp(7px,.9vmin,12px);
    border-radius:99px; background:rgba(255,255,255,.3);
    transition:background .4s ease, width .4s ease;
  }
  .dots i.on{ background:var(--orange); width:clamp(22px,2.8vmin,38px); }

  @media (prefers-reduced-motion: reduce){
    .slide{ transition-duration:.15s; }
    .dots i{ transition:none; }
  }
</style>
</head>
<body>

<div class="stage">
  <header class="brandbar">
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="title" id="title"></h1>
    </div>
    <div class="clock" id="clock"></div>
  </header>

  <main class="panel" id="panel"></main>

  <footer class="ticker">
    <svg class="wave" id="wave" viewBox="0 0 1000 60" preserveAspectRatio="none" aria-hidden="true">
      <path class="track" id="track"></path>
      <path class="fill"  id="fill"></path>
    </svg>
    <div class="dots" id="dots"></div>
  </footer>
</div>

<script>
(function(){
  'use strict';

  var EMBED_W = 504;
  var panel   = document.getElementById('panel');
  var dotsEl  = document.getElementById('dots');
  var slides  = [];
  var current = [];
  var idx = -1, started = 0, paused = false, pausedAt = 0;
  var DUR = (CONFIG.secondsPerScreen || 20) * 1000;
  var PER = Math.max(1, Math.min(4, CONFIG.postsPerScreen || 3));

  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;
  document.getElementById('title').textContent   = CONFIG.title;

  /* ── sine wave progress ─────────────────────────────── */
  var track = document.getElementById('track');
  var fill  = document.getElementById('fill');
  var d = '';
  for (var x = 0; x <= 1000; x += 4){
    var y = 30 - 19 * Math.sin((x / 1000) * Math.PI * 5);
    d += (x === 0 ? 'M' : 'L') + x + ' ' + y.toFixed(2) + ' ';
  }
  track.setAttribute('d', d);
  fill.setAttribute('d', d);
  var LEN = fill.getTotalLength();
  fill.style.strokeDasharray = LEN;
  function drawWave(p){ fill.style.strokeDashoffset = LEN * (1 - p); }
  drawWave(0);

  /* ── clock ──────────────────────────────────────────── */
  var clock = document.getElementById('clock');
  function tick(){
    clock.textContent = new Date().toLocaleString('en-AU', {
      weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    });
  }
  tick(); setInterval(tick, 20000);

  function notice(head, body){
    panel.innerHTML = '';
    dotsEl.innerHTML = '';
    slides = [];
    var n = document.createElement('div');
    n.className = 'notice';
    n.innerHTML = '<b>' + head + '</b><span>' + body + '</span>';
    panel.appendChild(n);
  }
  notice('Connecting', 'Fetching the latest posts from LinkedIn.');

  /* ── build screenfuls of PER posts each ─────────────── */
  function build(posts){
    panel.innerHTML = '';
    dotsEl.innerHTML = '';
    slides = [];

    var pages = [];
    for (var i = 0; i < posts.length; i += PER) pages.push(posts.slice(i, i + PER));

    // avoid a lonely final screen with one card on it
    if (pages.length > 1 && pages[pages.length - 1].length < PER){
      var tail = pages.pop();
      pages[pages.length - 1] = pages[pages.length - 1].concat(tail).slice(-PER);
    }

    pages.forEach(function(page){
      var slide = document.createElement('div');
      slide.className = 'slide';
      slide.style.gridTemplateRows = 'repeat(' + PER + ', 1fr)';

      page.forEach(function(p, j){
        var card = document.createElement('div');
        card.className = 'card';

        var scaler = document.createElement('div');
        scaler.className = 'scaler';
        scaler.style.height = CONFIG.cropHeight + 'px';

        var f = document.createElement('iframe');
        f.src = 'https://www.linkedin.com/embed/feed/update/' + p.urn +
                (CONFIG.collapseLongText ? '?collapsed=1' : '');
        f.setAttribute('title', p.title || 'LinkedIn post');
        f.setAttribute('scrolling', 'no');
        f.setAttribute('frameborder', '0');
        f.setAttribute('allowfullscreen', '');
        f.setAttribute('allow', 'encrypted-media *; autoplay');
        scaler.appendChild(f);

        card.appendChild(scaler);
        slide.appendChild(card);
      });

      // pad a short page so the grid keeps its shape
      for (var k = page.length; k < PER; k++){
        var blank = document.createElement('div');
        slide.appendChild(blank);
      }

      panel.appendChild(slide);

      var dot = document.createElement('i');
      dotsEl.appendChild(dot);

      slides.push({ el: slide, dot: dot });
    });

    layout();
    idx = -1;
    show(0);
  }

  /* Scale each embed to the card's width and anchor it to the top, so the
     card's own height does the cropping. Every card ends up identical. */
  function layout(){
    var cards = panel.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++){
      var w = cards[i].clientWidth;
      var s = cards[i].querySelector('.scaler');
      if (s) s.style.transform = 'scale(' + (w / EMBED_W) + ')';
    }
  }
  window.addEventListener('resize', layout);

  function show(n){
    if (!slides.length) return;
    idx = (n + slides.length) % slides.length;
    slides.forEach(function(s, i){
      s.el.classList.toggle('is-live', i === idx);
      s.dot.classList.toggle('on', i === idx);
    });
    started = performance.now();
    drawWave(0);
  }

  function frame(now){
    if (!paused && slides.length){
      var p = Math.min((now - started) / DUR, 1);
      drawWave(p);
      if (p >= 1) show(idx + 1);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ── poll posts.json ────────────────────────────────── */
  function sameList(a, b){
    return a.length === b.length && a.every(function(v, i){ return v === b[i]; });
  }

  function refresh(){
    fetch(CONFIG.feedApi + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(data){
        var posts = (data && data.posts) || [];
        if (!posts.length){
          if (!slides.length){
            notice('No posts yet',
                   'posts.json loaded but had no LinkedIn posts in it. ' +
                   'Check the FEED_URL secret and re-run the Action.');
          }
          return;
        }
        var urns = posts.map(function(p){ return p.urn; });
        if (!sameList(urns, current)){
          current = urns;
          build(posts);
        }
      })
      .catch(function(){
        if (!slides.length){
          notice('Can\u2019t reach the feed',
                 'The player could not load posts.json. It will keep retrying.');
        }
      });
  }

  refresh();
  setInterval(refresh, Math.max(5, CONFIG.refreshMinutes || 15) * 60000);

  /* ── manual control while testing ───────────────────── */
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === ' '){
      e.preventDefault();
      if (paused){ started += performance.now() - pausedAt; paused = false; }
      else { pausedAt = performance.now(); paused = true; }
    }
  });
})();
</script>
</body>
</html>
